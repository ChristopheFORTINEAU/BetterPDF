
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Route /api/process dans server.py fourni; le mapping Apache /BetterPDF est à confirmer. -->
    <meta name="betterpdf-api-base" content="http://176.150.161.213/BetterPDF">
    <title>BetterPDF - Pour des PDF faciles à imprimer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

        :root {
            color-scheme: light;
            --surface: #ECF0F3;
            --ink: #2d3748;
            --muted: #657184;
            --shadow-dark: rgba(163, 177, 198, .62);
            --shadow-light: rgba(255, 255, 255, .92);
            --accent: #3b6fe0;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            background: var(--surface);
        }

        .container {
            width: min(100%, 420px);
            padding: 28px 26px 30px;
            border-radius: 40px;
            background: var(--surface);
            box-shadow: 18px 18px 38px var(--shadow-dark), -18px -18px 38px var(--shadow-light);
        }

        h1 {
            margin: 0 0 14px;
            padding: 19px 14px 20px;
            border: 0;
            border-radius: 32px;
            color: #5978A8;
            text-align: center;
            font-size: clamp(2.8rem, 11vw, 4rem);
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: .015em;
            text-shadow: 1px 1px 2px rgba(255,255,255,.92);
            background: var(--surface);
            box-shadow: 9px 9px 19px var(--shadow-dark), -9px -9px 19px var(--shadow-light);
        }

        .subtitle {
            margin: 0 0 26px;
            color: #4a5568;
            text-align: center;
            font-size: clamp(.62rem, 3.5vw, 1rem);
            line-height: 1.55;
            font-weight: 800;
            letter-spacing: .12em;
            white-space: nowrap;
        }

        .drop-zone {
            margin: 0 0 22px;
            padding: 30px 20px;
            border-radius: 32px;
            color: var(--muted);
            text-align: center;
            cursor: pointer;
            background: var(--surface);
            box-shadow: inset 8px 8px 17px var(--shadow-dark), inset -8px -8px 17px var(--shadow-light);
            transition: box-shadow .22s ease, transform .22s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            box-shadow: inset 11px 11px 21px var(--shadow-dark), inset -11px -11px 21px var(--shadow-light);
        }
        .drop-zone:active { transform: scale(.99); }
        .drop-zone p { margin: 0; color: #566276; font-size: 1rem; font-weight: 800; }
        .drop-zone .drop-logo {
            display: block;
            width: min(210px, 72%);
            max-width: 100%;
            height: auto;
            margin: 0 auto 16px;
            mix-blend-mode: multiply;
        }

        #fileInput { display: none; }

        .btn-select, .btn-download {
            display: block;
            width: 100%;
            min-height: 58px;
            padding: 16px 18px;
            border: 0;
            border-radius: 35px;
            color: var(--ink);
            background: var(--surface);
            font-family: 'Nunito', sans-serif;
            font-size: .91rem;
            font-weight: 900;
            letter-spacing: .075em;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 8px 8px 17px var(--shadow-dark), -8px -8px 17px var(--shadow-light);
            transition: box-shadow .2s ease, transform .2s ease, color .2s ease;
        }
        .btn-select { margin-bottom: 24px; }
        .btn-select:hover, .btn-download:hover {
            color: var(--accent);
            box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light);
        }
        .btn-select:active, .btn-download:active {
            transform: scale(.985);
            box-shadow: inset 9px 9px 17px var(--shadow-dark), inset -9px -9px 17px var(--shadow-light);
        }
        .btn-select:focus-visible, .btn-download:focus-visible, .drop-zone:focus-visible {
            outline: 3px solid rgba(59,111,224,.55);
            outline-offset: 4px;
        }

        .progress-container {
            display: none;
            width: 100%;
            height: 24px;
            margin: 0 0 12px;
            overflow: hidden;
            border-radius: 18px;
            background: var(--surface);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .progress-bar {
            display: flex;
            width: 0%;
            height: 100%;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            color: #fff;
            background: linear-gradient(90deg, #3b6fe0, #6b91ed);
            font-size: .76rem;
            font-weight: 900;
            transition: width .3s ease;
        }
        .progress-text {
            display: none;
            margin: 0 0 18px;
            color: var(--muted);
            text-align: center;
            font-weight: 800;
        }

        .file-list { display: none; margin: 0 0 20px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
            padding: 13px 16px;
            overflow-wrap: anywhere;
            border-radius: 20px;
            color: var(--ink);
            background: var(--surface);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            font-size: .9rem;
            font-weight: 700;
        }
        .file-item .file-icon { flex: 0 0 auto; }

        .btn-download {
            display: none;
            margin-top: 3px;
            color: #fff;
            background: #3b6fe0;
        }
        .btn-download:hover { color: #fff; background: #3565d1; }
        .btn-download:active {
            box-shadow: inset 8px 8px 15px rgba(30,68,152,.45), inset -8px -8px 15px rgba(118,155,239,.55);
        }

        .status-message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 20px;
            text-align: center;
            font-weight: 800;
        }
        .status-success {
            color: #21834c;
            background: #e2f1e8;
            box-shadow: inset 5px 5px 10px rgba(163,177,166,.55), inset -5px -5px 10px #f7fff9;
        }
        .status-error {
            color: #d63031;
            background: #f4e4e5;
            box-shadow: inset 5px 5px 10px rgba(190,156,160,.5), inset -5px -5px 10px #fff7f7;
        }

        @media (max-width: 480px) {
            body { padding: 20px 14px; align-items: flex-start; }
            .container { padding: 22px 19px 24px; border-radius: 34px; }
            h1 { border-radius: 27px; }
            .subtitle { margin-bottom: 22px; font-size: clamp(.59rem, 3.5vw, .9rem); }
            .drop-zone { padding: 25px 16px; border-radius: 28px; }
        }
</style>
</head>
<body>
    <div class="container">
        <h1>BetterPDF</h1>
        <p class="subtitle">pour des PDF faciles à imprimer</p>

        <div class="drop-zone" id="dropZone">
            <img class="drop-logo" src="logo-fichier.png" alt="logo-fichier">
            <p>Déposez ici les PDF à traiter</p>
        </div>

        <input type="file" id="fileInput" accept=".pdf" multiple>

        <button class="btn-select" id="btnSelect">Sélectionner fichiers PDF</button>

        <div class="file-list" id="fileList"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <p class="progress-text" id="progressText">Traitement en cours...</p>

        <button class="btn-download" id="btnDownload">⬇️ Télécharger le PDF traité</button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        // Pour une page hébergée ailleurs, définir window.BETTERPDF_API_BASE
        // (ex. https://betterpdf-server.onrender.com) avant ce script.
        // Par défaut, l’API est sur la même origine que la page Flask.
        const configuredApiBase = window.BETTERPDF_API_BASE ||
            document.querySelector('meta[name="betterpdf-api-base"]')?.content ||
            new URLSearchParams(window.location.search).get('apiBase') || '';
        const API_BASE = (configuredApiBase ||
            (/^https?:$/.test(window.location.protocol) ? window.location.origin : '')).replace(/\/+$/, '');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const btnSelect = document.getElementById('btnSelect');
        const fileList = document.getElementById('fileList');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const btnDownload = document.getElementById('btnDownload');
        const statusMessage = document.getElementById('statusMessage');
        let selectedFiles = [];
        let processedBlob = null;
        let processedFilename = '';

        dropZone.addEventListener('click', () => fileInput.click());
        btnSelect.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault(); dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            if (!selectedFiles.length) {
                showStatus('Veuillez sélectionner des fichiers PDF valides.', 'error'); return;
            }
            fileList.innerHTML = '';
            selectedFiles.forEach(file => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.textContent = `📑 ${file.name}`;
                fileList.appendChild(item);
            });
            fileList.style.display = 'block';
            processFiles();
        }

        function responseFilename(disposition, fallback) {
            if (!disposition) return fallback;
            const encoded = disposition.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
            if (encoded) {
                try { return decodeURIComponent(encoded[1].trim().replace(/^"|"$/g, '')); } catch (_) {}
            }
            const plain = disposition.match(/filename\s*=\s*"?([^";]+)"?/i);
            return plain ? plain[1].trim() : fallback;
        }

        async function processFiles() {
            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            btnDownload.style.display = 'none';
            statusMessage.style.display = 'none';
            processedBlob = null;
            const formData = new FormData();
            selectedFiles.forEach(file => formData.append('files', file, file.name));
            progressBar.style.width = '35%';
            progressBar.textContent = '35%';
            progressText.textContent = `Envoi et traitement de ${selectedFiles.length} PDF...`;
            try {
                if (!API_BASE) {
                    throw new Error('Configurez BETTERPDF_API_BASE pour joindre le serveur de traitement (page file:// ou hébergement externe).');
                }
                const response = await fetch(`${API_BASE}/api/process`, { method: 'POST', body: formData });
                if (!response.ok) {
                    let message = `Erreur serveur (${response.status})`;
                    try { message = (await response.json()).error || message; } catch (_) {}
                    throw new Error(message);
                }
                processedBlob = await response.blob();
                const fallback = selectedFiles.length === 1 ? selectedFiles[0].name : 'Livrables_BetterPDF.zip';
                processedFilename = responseFilename(response.headers.get('Content-Disposition'), fallback);
                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                progressText.textContent = 'Terminé !';
                btnDownload.textContent = selectedFiles.length === 1
                    ? `⬇️ Télécharger ${selectedFiles[0].name}`
                    : '⬇️ Télécharger le PDF traité';
                btnDownload.style.display = 'block';
                showStatus(`${selectedFiles.length} PDF traité(s) avec succès !`, 'success');
            } catch (error) {
                console.error('Erreur BetterPDF:', error);
                showStatus(`Erreur lors du traitement : ${error.message}`, 'error');
            }
        }

        btnDownload.addEventListener('click', () => {
            if (!processedBlob) return;
            const url = URL.createObjectURL(processedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = processedFilename || (selectedFiles.length === 1 ? selectedFiles[0].name : 'Livrables_BetterPDF.zip');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-' + type;
            statusMessage.style.display = 'block';
        }
    </script>
