<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterPDF - Pour des PDF plus faciles à imprimer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e0e5ec;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #e0e5ec;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow:
                20px 20px 60px #bebebe,
                -20px -20px 60px #ffffff;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            color: #2d3436;
            text-align: center;
            margin-bottom: 10px;
            padding: 15px 30px;
            border-radius: 20px;
            border: 3px solid #5978A8;
            box-shadow:
                inset 8px 8px 16px #bebebe,
                inset -8px -8px 16px #ffffff;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #636e72;
            font-style: italic;
            font-size: 1.1em;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .drop-zone {
            background: #e0e5ec;
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                inset 10px 10px 20px #bebebe,
                inset -10px -10px 20px #ffffff;
            margin-bottom: 25px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            box-shadow:
                inset 15px 15px 30px #bebebe,
                inset -15px -15px 30px #ffffff;
        }

        .drop-zone p {
            color: #636e72;
            font-size: 1.1em;
            font-weight: 500;
        }

        .drop-zone .icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        #fileInput {
            display: none;
        }

        .btn-select {
            display: block;
            width: 100%;
            padding: 18px;
            background: #e0e5ec;
            border: none;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            font-weight: 600;
            color: #5978A8;
            cursor: pointer;
            box-shadow:
                10px 10px 20px #bebebe,
                -10px -10px 20px #ffffff;
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .btn-select:hover {
            box-shadow:
                inset 8px 8px 16px #bebebe,
                inset -8px -8px 16px #ffffff;
        }

        .btn-select:active {
            box-shadow:
                inset 10px 10px 20px #bebebe,
                inset -10px -10px 20px #ffffff;
        }

        .progress-container {
            width: 100%;
            height: 30px;
            background: #e0e5ec;
            border-radius: 15px;
            box-shadow:
                inset 8px 8px 16px #bebebe,
                inset -8px -8px 16px #ffffff;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #5978A8;
            border-radius: 15px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85em;
        }

        .progress-text {
            text-align: center;
            color: #636e72;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
        }

        .file-list {
            margin-bottom: 20px;
            display: none;
        }

        .file-item {
            background: #e0e5ec;
            border-radius: 15px;
            padding: 12px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            box-shadow:
                6px 6px 12px #bebebe,
                -6px -6px 12px #ffffff;
            font-size: 0.9em;
            color: #2d3436;
        }

        .file-item .file-icon {
            margin-right: 10px;
        }

        .btn-download {
            display: none;
            width: 100%;
            padding: 18px;
            background: #5978A8;
            border: none;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow:
                10px 10px 20px #bebebe,
                -10px -10px 20px #ffffff;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: #4a6491;
        }

        .btn-download:active {
            box-shadow:
                inset 8px 8px 16px #3d5276,
                inset -8px -8px 16px #5978A8;
        }

        .status-message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-weight: 500;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            box-shadow:
                inset 5px 5px 10px #b8d4bc,
                inset -5px -5px 10px #effff0;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            box-shadow:
                inset 5px 5px 10px #d4b5b9,
                inset -5px -5px 10px #ffeef0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BetterPDF</h1>
        <p class="subtitle">pour des PDF plus faciles à imprimer</p>

        <div class="drop-zone" id="dropZone">
            <span class="icon">📄</span>
            <p>Déposez ici les PDF à traiter</p>
        </div>

        <input type="file" id="fileInput" accept=".pdf" multiple>

        <button class="btn-select" id="btnSelect">Sélectionner fichiers PDF</button>

        <div class="file-list" id="fileList"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <p class="progress-text" id="progressText">Traitement en cours...</p>

        <button class="btn-download" id="btnDownload">⬇️ Télécharger Livrables_BetterPDF.zip</button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const btnSelect = document.getElementById('btnSelect');
        const fileList = document.getElementById('fileList');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const btnDownload = document.getElementById('btnDownload');
        const statusMessage = document.getElementById('statusMessage');

        let selectedFiles = [];
        let processedZipBlob = null;

        // Gestion du clic sur la zone de dépôt
        dropZone.addEventListener('click', () => fileInput.click());
        btnSelect.addEventListener('click', () => fileInput.click());

        // Gestion du drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));

            if (selectedFiles.length === 0) {
                showStatus('Veuillez sélectionner des fichiers PDF valides.', 'error');
                return;
            }

            // Afficher la liste des fichiers
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span class="file-icon">📑</span> ${file.name}`;
                fileList.appendChild(item);
            });
            fileList.style.display = 'block';

            // Lancer le traitement
            processFiles();
        }

        async function processFiles() {
            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            btnDownload.style.display = 'none';
            statusMessage.style.display = 'none';

            const zip = new JSZip();
            const totalFiles = selectedFiles.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = selectedFiles[i];
                const progress = Math.round(((i + 1) / totalFiles) * 100);

                progressBar.style.width = progress + '%';
                progressBar.textContent = progress + '%';
                progressText.textContent = `Traitement de ${file.name}... (${i + 1}/${totalFiles})`;

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });

                    // Traitement de chaque page
                    const pages = pdfDoc.getPages();
                    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

                    for (const page of pages) {
                        const { width, height } = page.getSize();

                        // Appliquer le cropbox avec marges de 20pt
                        const margin = 20;
                        page.setCropBox(margin, margin, width - margin, height - margin);
                        page.setMediaBox(margin, margin, width - margin, height - margin);
                        page.setBleedBox(margin, margin, width - margin, height - margin);
                        page.setTrimBox(margin, margin, width - margin, height - margin);
                        page.setArtBox(margin, margin, width - margin, height - margin);

                        // Ajouter le watermark invisible "BetterPdfVersion" en blanc sur blanc
                        // Position : bas-droite, très petit (4pt)
                        page.drawText('BetterPdfVersion', {
                            x: width - margin - 50,
                            y: margin + 5,
                            size: 4,
                            font: font,
                            color: rgb(1, 1, 1), // Blanc sur blanc = invisible
                            opacity: 1
                        });
                    }

                    // Sauvegarder le PDF modifié
                    const pdfBytes = await pdfDoc.save();

                    // Ajouter au ZIP avec le nom modifié
                    const originalName = file.name.replace(/\.pdf$/i, '');
                    const newName = `${originalName}_BetterPDF.pdf`;
                    zip.file(newName, pdfBytes);

                } catch (error) {
                    console.error(`Erreur avec ${file.name}:`, error);
                    showStatus(`Erreur lors du traitement de ${file.name}: ${error.message}`, 'error');
                    return;
                }

                // Petite pause pour permettre l'UI de se rafraîchir
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            // Générer le ZIP
            progressText.textContent = 'Création du ZIP...';
            try {
                processedZipBlob = await zip.generateAsync({ type: 'blob' });

                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                progressText.textContent = 'Terminé !';
                btnDownload.style.display = 'block';

                showStatus(`${totalFiles} PDF traité(s) avec succès !`, 'success');

            } catch (error) {
                console.error('Erreur ZIP:', error);
                showStatus(`Erreur lors de la création du ZIP: ${error.message}`, 'error');
            }
        }

        btnDownload.addEventListener('click', () => {
            if (processedZipBlob) {
                const url = URL.createObjectURL(processedZipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Livrables_BetterPDF.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-' + type;
            statusMessage.style.display = 'block';
        }
    </script>
</body>
</html>
