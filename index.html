<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterPDF - Pour des PDF faciles à imprimer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

        :root {
            color-scheme: light;
            --surface: #ECF0F3;
            --ink: #2d3748;
            --muted: #657184;
            --shadow-dark: rgba(163, 177, 198, .62);
            --shadow-light: rgba(255, 255, 255, .92);
            --accent: #3b6fe0;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            background: var(--surface);
        }

        .container {
            width: min(100%, 420px);
            padding: 28px 26px 30px;
            border-radius: 40px;
            background: var(--surface);
            box-shadow: 18px 18px 38px var(--shadow-dark), -18px -18px 38px var(--shadow-light);
        }

        h1 {
            margin: 0 0 14px;
            padding: 19px 14px 20px;
            border: 0;
            border-radius: 32px;
            color: #5978A8;
            text-align: center;
            font-size: clamp(2.8rem, 11vw, 4rem);
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: .015em;
            text-shadow: 1px 1px 2px rgba(255,255,255,.92);
            background: var(--surface);
            box-shadow: 9px 9px 19px var(--shadow-dark), -9px -9px 19px var(--shadow-light);
        }

        .subtitle {
            margin: 0 0 26px;
            color: #4a5568;
            text-align: center;
            font-size: clamp(.62rem, 3.5vw, 1rem);
            line-height: 1.55;
            font-weight: 800;
            letter-spacing: .12em;
            white-space: nowrap;
        }

        .drop-zone {
            margin: 0 0 22px;
            padding: 30px 20px;
            border-radius: 32px;
            color: var(--muted);
            text-align: center;
            cursor: pointer;
            background: var(--surface);
            box-shadow: inset 8px 8px 17px var(--shadow-dark), inset -8px -8px 17px var(--shadow-light);
            transition: box-shadow .22s ease, transform .22s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            box-shadow: inset 11px 11px 21px var(--shadow-dark), inset -11px -11px 21px var(--shadow-light);
        }
        .drop-zone:active { transform: scale(.99); }
        .drop-zone p { margin: 0; color: #566276; font-size: 1rem; font-weight: 800; }
        .drop-zone .drop-logo {
            display: block;
            width: min(210px, 72%);
            max-width: 100%;
            height: auto;
            margin: 0 auto 16px;
            mix-blend-mode: multiply;
        }

        #fileInput { display: none; }

        .btn-select, .btn-download {
            display: block;
            width: 100%;
            min-height: 58px;
            padding: 16px 18px;
            border: 0;
            border-radius: 35px;
            color: var(--ink);
            background: var(--surface);
            font-family: 'Nunito', sans-serif;
            font-size: .91rem;
            font-weight: 900;
            letter-spacing: .075em;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 8px 8px 17px var(--shadow-dark), -8px -8px 17px var(--shadow-light);
            transition: box-shadow .2s ease, transform .2s ease, color .2s ease;
        }
        .btn-select { margin-bottom: 24px; }
        .btn-select:hover, .btn-download:hover {
            color: var(--accent);
            box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light);
        }
        .btn-select:active, .btn-download:active {
            transform: scale(.985);
            box-shadow: inset 9px 9px 17px var(--shadow-dark), inset -9px -9px 17px var(--shadow-light);
        }
        .btn-select:focus-visible, .btn-download:focus-visible, .drop-zone:focus-visible {
            outline: 3px solid rgba(59,111,224,.55);
            outline-offset: 4px;
        }

        .progress-container {
            display: none;
            width: 100%;
            height: 24px;
            margin: 0 0 12px;
            overflow: hidden;
            border-radius: 18px;
            background: var(--surface);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .progress-bar {
            display: flex;
            width: 0%;
            height: 100%;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            color: #fff;
            background: linear-gradient(90deg, #3b6fe0, #6b91ed);
            font-size: .76rem;
            font-weight: 900;
            transition: width .3s ease;
        }
        .progress-text {
            display: none;
            margin: 0 0 18px;
            color: var(--muted);
            text-align: center;
            font-weight: 800;
        }

        .file-list { display: none; margin: 0 0 20px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
            padding: 13px 16px;
            overflow-wrap: anywhere;
            border-radius: 20px;
            color: var(--ink);
            background: var(--surface);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            font-size: .9rem;
            font-weight: 700;
        }
        .file-item .file-icon { flex: 0 0 auto; }

        .btn-download {
            display: none;
            margin-top: 3px;
            color: #fff;
            background: #3b6fe0;
        }
        .btn-download:hover { color: #fff; background: #3565d1; }
        .btn-download:active {
            box-shadow: inset 8px 8px 15px rgba(30,68,152,.45), inset -8px -8px 15px rgba(118,155,239,.55);
        }

        .status-message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 20px;
            text-align: center;
            font-weight: 800;
        }
        .status-success {
            color: #21834c;
            background: #e2f1e8;
            box-shadow: inset 5px 5px 10px rgba(163,177,166,.55), inset -5px -5px 10px #f7fff9;
        }
        .status-error {
            color: #d63031;
            background: #f4e4e5;
            box-shadow: inset 5px 5px 10px rgba(190,156,160,.5), inset -5px -5px 10px #fff7f7;
        }

        @media (max-width: 480px) {
            body { padding: 20px 14px; align-items: flex-start; }
            .container { padding: 22px 19px 24px; border-radius: 34px; }
            h1 { border-radius: 27px; }
            .subtitle { margin-bottom: 22px; font-size: clamp(.59rem, 3.5vw, .9rem); }
            .drop-zone { padding: 25px 16px; border-radius: 28px; }
        }
</style>
</head>
<body>
    <div class="container">
        <h1>BetterPDF</h1>
        <p class="subtitle">pour des PDF faciles à imprimer</p>

        <div class="drop-zone" id="dropZone">
            <img class="drop-logo" src="logo-fichier.png" alt="logo-fichier">
            <p>Déposez ici les PDF à traiter</p>
        </div>

        <input type="file" id="fileInput" accept=".pdf" multiple>

        <button class="btn-select" id="btnSelect">Sélectionner fichiers PDF</button>

        <div class="file-list" id="fileList"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        <p class="progress-text" id="progressText">Traitement en cours...</p>

        <button class="btn-download" id="btnDownload">⬇️ Télécharger Livrables_BetterPDF.zip</button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const btnSelect = document.getElementById('btnSelect');
        const fileList = document.getElementById('fileList');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const btnDownload = document.getElementById('btnDownload');
        const statusMessage = document.getElementById('statusMessage');

        let selectedFiles = [];
        let processedZipBlob = null;

        // Gestion du clic sur la zone de dépôt
        dropZone.addEventListener('click', () => fileInput.click());
        btnSelect.addEventListener('click', () => fileInput.click());

        // Gestion du drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));

            if (selectedFiles.length === 0) {
                showStatus('Veuillez sélectionner des fichiers PDF valides.', 'error');
                return;
            }

            // Afficher la liste des fichiers
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span class="file-icon">📑</span> ${file.name}`;
                fileList.appendChild(item);
            });
            fileList.style.display = 'block';

            // Lancer le traitement
            processFiles();
        }

        async function processFiles() {
            progressContainer.style.display = 'block';
            progressText.style.display = 'block';
            btnDownload.style.display = 'none';
            statusMessage.style.display = 'none';

            const zip = new JSZip();
            const totalFiles = selectedFiles.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = selectedFiles[i];
                const progress = Math.round(((i + 1) / totalFiles) * 100);

                progressBar.style.width = progress + '%';
                progressBar.textContent = progress + '%';
                progressText.textContent = `Traitement de ${file.name}... (${i + 1}/${totalFiles})`;

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });

                    // Traitement de chaque page
                    const pages = pdfDoc.getPages();
                    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

                    for (const page of pages) {
                        const { width, height } = page.getSize();

                        // Appliquer le cropbox avec marges de 20pt
                        const margin = 20;
                        page.setCropBox(margin, margin, width - margin, height - margin);
                        page.setMediaBox(margin, margin, width - margin, height - margin);
                        page.setBleedBox(margin, margin, width - margin, height - margin);
                        page.setTrimBox(margin, margin, width - margin, height - margin);
                        page.setArtBox(margin, margin, width - margin, height - margin);

                        // Ajouter le watermark invisible "BetterPdfVersion" en blanc sur blanc
                        // Position : bas-droite, très petit (4pt)
                        page.drawText('BetterPdfVersion', {
                            x: width - margin - 50,
                            y: margin + 5,
                            size: 4,
                            font: font,
                            color: rgb(1, 1, 1), // Blanc sur blanc = invisible
                            opacity: 1
                        });
                    }

                    // Sauvegarder le PDF modifié
                    const pdfBytes = await pdfDoc.save();

                    // Ajouter au ZIP avec le nom modifié
                    const originalName = file.name.replace(/\.pdf$/i, '');
                    const newName = `${originalName}_BetterPDF.pdf`;
                    zip.file(newName, pdfBytes);

                } catch (error) {
                    console.error(`Erreur avec ${file.name}:`, error);
                    showStatus(`Erreur lors du traitement de ${file.name}: ${error.message}`, 'error');
                    return;
                }

                // Petite pause pour permettre l'UI de se rafraîchir
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            // Générer le ZIP
            progressText.textContent = 'Création du ZIP...';
            try {
                processedZipBlob = await zip.generateAsync({ type: 'blob' });

                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                progressText.textContent = 'Terminé !';
                btnDownload.style.display = 'block';

                showStatus(`${totalFiles} PDF traité(s) avec succès !`, 'success');

            } catch (error) {
                console.error('Erreur ZIP:', error);
                showStatus(`Erreur lors de la création du ZIP: ${error.message}`, 'error');
            }
        }

        btnDownload.addEventListener('click', () => {
            if (processedZipBlob) {
                const url = URL.createObjectURL(processedZipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Livrables_BetterPDF.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-' + type;
            statusMessage.style.display = 'block';
        }
    </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
