name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Recuperer les fichiers du projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fabriquer BetterPDF.exe
        run: |
          pyinstaller --windowed --onefile --name BetterPDF --icon BetterPDF.ico --add-data "SilentPDF.py;." --add-data "optimizer.py;." betterpdf_gui.py

      - name: Publier l'executable
        uses: actions/upload-artifact@v4
        with:
          name: BetterPDF-windows
          path: dist/BetterPDF.exe
